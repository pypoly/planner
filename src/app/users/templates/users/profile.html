{% extends 'base.html' %}
{% block title %}
	Профиль
{% endblock %}
{% block content %}
<p>
    <form method="post">
    {% csrf_token %}
    {{ form_profile }}
    <button value="profile" type="submit" name="action">Сохранить</button>
    {{ form_profile.errors }}
    </form>
</p>
<p>
    <form method="post">
    {% csrf_token %}
    {{ form_password }}
    <button value="password" name="action">Сменить пароль</button>

    {{ form_password.errors }}
    </form>
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Выйти</button>
</form>
</p>
{% endblock %}
