{% extends 'admin_panel/base.html' %}
{% load static %}


{% block content %}
    <h3>{{ todo }}</h3>
    <a href="{% url 'adm:todo_update' pk=todo.pk %}">Редактировать тудушку</a>
    <ol>
    {% for task in tasks %}
        <li><a href="{% url 'adm:task_update' pk=task.pk %}">{{ task.name }}</a></li>
    {% endfor %}
    </ol>
{% endblock %}
