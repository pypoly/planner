{% extends 'base.html' %}
{% load status_label %}
{% block title %}
	Главная страница
{% endblock %}
{% block content %}
<a href="{% url 'profile' %}">Профиль</a> <br>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Выйти</button>
        </form>
<h1>Все цели</h1>
<ol>
    {% for todolist in todolists_lists %}
       <li>
           <a href="{% url 'detail' pk=todolist.pk %}">{{ todolist.title }}</a>
       </li>
    {% endfor %}
</ol>
<a href="{% url 'create' %}"> Создать новую тудушку </a>
{% endblock %}
